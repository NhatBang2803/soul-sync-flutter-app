<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard Mobile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Custom scrollbar cho nó nghệ */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }

        .glass-effect {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
        }
    </style>
</head>

<body class="bg-gray-50 text-gray-800 font-sans antialiased">

    <div id="overlay" onclick="closeAll()"
        class="fixed inset-0 bg-black/50 z-40 hidden transition-opacity duration-300"></div>

    <aside id="sidebar"
        class="fixed top-0 left-0 w-64 h-full bg-slate-900 text-white transform -translate-x-full transition-transform duration-300 z-50 shadow-2xl flex flex-col">
        <div class="p-6 border-b border-slate-700 flex justify-between items-center">
            <h2 class="text-2xl font-bold tracking-tighter text-indigo-400">DEV<span class="text-white">ADMIN</span>
            </h2>
            <button onclick="toggleSidebar()" class="text-gray-400 hover:text-white"><i
                    class="fa-solid fa-xmark text-xl"></i></button>
        </div>
        <nav class="flex-1 p-4 space-y-2 overflow-y-auto">
            <a href="#"
                class="flex items-center space-x-3 p-3 rounded-lg bg-indigo-600 text-white shadow-lg shadow-indigo-500/30">
                <i class="fa-solid fa-chart-line w-6 text-center"></i><span>Dashboard</span>
            </a>
            <a href="#"
                class="flex items-center space-x-3 p-3 rounded-lg hover:bg-slate-800 text-slate-300 transition-colors">
                <i class="fa-solid fa-users w-6 text-center"></i><span>Users CRUD</span>
            </a>
            <a href="#"
                class="flex items-center space-x-3 p-3 rounded-lg hover:bg-slate-800 text-slate-300 transition-colors">
                <i class="fa-solid fa-box w-6 text-center"></i><span>Products</span>
            </a>
            <a href="#"
                class="flex items-center space-x-3 p-3 rounded-lg hover:bg-slate-800 text-slate-300 transition-colors">
                <i class="fa-solid fa-gear w-6 text-center"></i><span>Settings</span>
            </a>
        </nav>
        <div class="p-4 border-t border-slate-700">
            <button class="flex items-center space-x-3 w-full p-2 text-red-400 hover:text-red-300">
                <i class="fa-solid fa-right-from-bracket"></i><span>Logout</span>
            </button>
        </div>
    </aside>

    <div class="flex flex-col min-h-screen">

        <header
            class="sticky top-0 z-30 glass-effect border-b border-gray-200 px-4 py-3 flex justify-between items-center shadow-sm">
            <button onclick="toggleSidebar()" class="p-2 rounded-md hover:bg-gray-100 text-gray-600">
                <i class="fa-solid fa-bars text-xl"></i>
            </button>
            <h1 class="font-bold text-lg text-gray-700">Dashboard</h1>
            <div
                class="w-8 h-8 rounded-full bg-indigo-100 flex items-center justify-center text-indigo-600 font-bold border border-indigo-200">
                A
            </div>
        </header>

        <main class="flex-1 p-4 space-y-6">

            <div class="grid grid-cols-2 gap-3">
                <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                    <div class="text-xs text-gray-500 uppercase font-semibold">Total Users</div>
                    <div class="text-2xl font-bold text-indigo-600 mt-1">1,245</div>
                    <div class="text-xs text-green-500 mt-1"><i class="fa-solid fa-arrow-up"></i> 12%</div>
                </div>
                <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                    <div class="text-xs text-gray-500 uppercase font-semibold">Revenue</div>
                    <div class="text-2xl font-bold text-emerald-600 mt-1">$34k</div>
                    <div class="text-xs text-green-500 mt-1"><i class="fa-solid fa-arrow-up"></i> 5%</div>
                </div>
            </div>

            <section>
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-bold text-gray-800">User Management</h2>
                    <button onclick="openModal('create')"
                        class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-medium shadow-md transition-transform active:scale-95 flex items-center gap-2">
                        <i class="fa-solid fa-plus"></i> Add New
                    </button>
                </div>

                <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-sm whitespace-nowrap">
                            <thead class="bg-gray-50 border-b border-gray-100">
                                <tr>
                                    <th class="p-4 font-semibold text-gray-600">Name</th>
                                    <th class="p-4 font-semibold text-gray-600">Role</th>
                                    <th class="p-4 font-semibold text-gray-600">Status</th>
                                    <th class="p-4 font-semibold text-gray-600 text-right">Actions</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-gray-100">
                                <tr class="hover:bg-gray-50 transition-colors">
                                    <td class="p-4 font-medium text-gray-900 flex items-center gap-3">
                                        <div
                                            class="w-8 h-8 rounded-full bg-purple-100 text-purple-600 flex items-center justify-center text-xs font-bold">
                                            JD</div>
                                        John Doe
                                    </td>
                                    <td class="p-4 text-gray-500">Admin</td>
                                    <td class="p-4">
                                        <span
                                            class="px-2 py-1 rounded-full text-xs font-semibold bg-green-100 text-green-700">Active</span>
                                    </td>
                                    <td class="p-4 text-right space-x-1">
                                        <button onclick="openModal('edit')"
                                            class="p-2 text-indigo-600 hover:bg-indigo-50 rounded"><i
                                                class="fa-solid fa-pen"></i></button>
                                        <button onclick="openDeleteModal()"
                                            class="p-2 text-red-500 hover:bg-red-50 rounded"><i
                                                class="fa-solid fa-trash"></i></button>
                                    </td>
                                </tr>
                                <tr class="hover:bg-gray-50 transition-colors">
                                    <td class="p-4 font-medium text-gray-900 flex items-center gap-3">
                                        <div
                                            class="w-8 h-8 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center text-xs font-bold">
                                            SA</div>
                                        Sarah Ann
                                    </td>
                                    <td class="p-4 text-gray-500">Editor</td>
                                    <td class="p-4">
                                        <span
                                            class="px-2 py-1 rounded-full text-xs font-semibold bg-gray-100 text-gray-600">Offline</span>
                                    </td>
                                    <td class="p-4 text-right space-x-1">
                                        <button onclick="openModal('edit')"
                                            class="p-2 text-indigo-600 hover:bg-indigo-50 rounded"><i
                                                class="fa-solid fa-pen"></i></button>
                                        <button onclick="openDeleteModal()"
                                            class="p-2 text-red-500 hover:bg-red-50 rounded"><i
                                                class="fa-solid fa-trash"></i></button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <div id="crudModal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4">
        <div
            class="bg-white w-full max-w-md rounded-2xl shadow-2xl overflow-hidden transform transition-all scale-95 opacity-0 modal-content">
            <div class="p-5 border-b border-gray-100 flex justify-between items-center bg-gray-50">
                <h3 id="modalTitle" class="font-bold text-lg text-gray-800">Add User</h3>
                <button onclick="closeAll()" class="text-gray-400 hover:text-gray-600"><i
                        class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <div class="p-6 space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
                    <input type="text" placeholder="e.g. Elon Musk"
                        class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Role</label>
                    <select
                        class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 outline-none">
                        <option>Admin</option>
                        <option>Editor</option>
                        <option>Viewer</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Status</label>
                    <div class="flex gap-4 mt-2">
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="radio" name="status" class="text-indigo-600 focus:ring-indigo-500" checked>
                            <span class="text-sm">Active</span>
                        </label>
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="radio" name="status" class="text-gray-600 focus:ring-gray-500">
                            <span class="text-sm">Inactive</span>
                        </label>
                    </div>
                </div>
            </div>
            <div class="p-5 border-t border-gray-100 flex justify-end gap-3 bg-gray-50">
                <button onclick="closeAll()"
                    class="px-4 py-2 rounded-lg text-gray-600 hover:bg-gray-200 font-medium text-sm">Cancel</button>
                <button onclick="closeAll()"
                    class="px-4 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white font-medium text-sm shadow-lg shadow-indigo-500/30">Save
                    Changes</button>
            </div>
        </div>
    </div>

    <div id="deleteModal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4">
        <div
            class="bg-white w-full max-w-sm rounded-2xl shadow-2xl p-6 text-center transform transition-all scale-95 opacity-0 modal-content">
            <div class="w-12 h-12 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4 text-red-500">
                <i class="fa-solid fa-triangle-exclamation text-xl"></i>
            </div>
            <h3 class="font-bold text-lg text-gray-800 mb-2">Delete User?</h3>
            <p class="text-sm text-gray-500 mb-6">Are you sure you want to delete this item? This action cannot be
                undone.</p>
            <div class="flex justify-center gap-3">
                <button onclick="closeAll()"
                    class="px-4 py-2 rounded-lg border border-gray-300 text-gray-700 hover:bg-gray-50 font-medium text-sm w-full">No,
                    cancel</button>
                <button onclick="closeAll()"
                    class="px-4 py-2 rounded-lg bg-red-500 hover:bg-red-600 text-white font-medium text-sm w-full shadow-lg shadow-red-500/30">Yes,
                    delete</button>
            </div>
        </div>
    </div>

    <script>
        // Elements
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        const crudModal = document.getElementById('crudModal');
        const deleteModal = document.getElementById('deleteModal');
        const modalTitle = document.getElementById('modalTitle');

        // Functions
        function toggleSidebar() {
            const isClosed = sidebar.classList.contains('-translate-x-full');
            if (isClosed) {
                sidebar.classList.remove('-translate-x-full');
                overlay.classList.remove('hidden');
                setTimeout(() => overlay.classList.remove('opacity-0'), 10);
            } else {
                sidebar.classList.add('-translate-x-full');
                // Nếu không có modal nào mở thì mới ẩn overlay
                if (crudModal.classList.contains('hidden') && deleteModal.classList.contains('hidden')) {
                    overlay.classList.add('opacity-0');
                    setTimeout(() => overlay.classList.add('hidden'), 300);
                }
            }
        }

        function openModal(type) {
            // Setup title
            modalTitle.innerText = type === 'create' ? 'Add New User' : 'Edit User';

            // Show modal
            crudModal.classList.remove('hidden');
            overlay.classList.remove('hidden');
            setTimeout(() => {
                overlay.classList.remove('opacity-0');
                crudModal.querySelector('.modal-content').classList.remove('scale-95', 'opacity-0');
                crudModal.querySelector('.modal-content').classList.add('scale-100', 'opacity-100');
            }, 10);
        }

        function openDeleteModal() {
            deleteModal.classList.remove('hidden');
            overlay.classList.remove('hidden');
            setTimeout(() => {
                overlay.classList.remove('opacity-0');
                deleteModal.querySelector('.modal-content').classList.remove('scale-95', 'opacity-0');
                deleteModal.querySelector('.modal-content').classList.add('scale-100', 'opacity-100');
            }, 10);
        }

        function closeAll() {
            // Close Sidebar
            sidebar.classList.add('-translate-x-full');

            // Close Modals Animation
            const openModals = document.querySelectorAll('.modal-content.scale-100');
            openModals.forEach(modal => {
                modal.classList.remove('scale-100', 'opacity-100');
                modal.classList.add('scale-95', 'opacity-0');
            });

            // Hide Overlay & Modals after animation
            overlay.classList.add('opacity-0');
            setTimeout(() => {
                overlay.classList.add('hidden');
                crudModal.classList.add('hidden');
                deleteModal.classList.add('hidden');
            }, 300);
        }
    </script>
</body>

</html>
